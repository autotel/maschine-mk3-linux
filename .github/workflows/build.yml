name: Build

# Pull requests only. Pushes to main are built by release.yml, which runs the
# same tests and then publishes the result, so building here too would be the
# same work twice.
on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # See release.yml: ALSA's headers and pkg-config are the whole list, GUI
      # included, because the windowing stack is dlopened rather than linked.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libasound2-dev

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build (release, all binaries)
        run: cargo build --release --all-features

      - name: Test
        run: cargo test --all-features

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: maschine-mk3-linux-x86_64
          path: |
            target/release/mk3d
            target/release/mk3-learn
            target/release/mk3-gui
          if-no-files-found: error
