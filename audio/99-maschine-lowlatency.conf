# PipeWire quantum settings for playing an instrument.
#
# Install to ~/.config/pipewire/pipewire.conf.d/99-maschine-lowlatency.conf
# and restart PipeWire:  systemctl --user restart pipewire pipewire-pulse
#
# The stock quantum of 1024 frames is 21 ms at 48 kHz, which is audible as a
# lag between striking a pad and hearing the sound. 128 frames is 2.7 ms and
# still leaves plenty of margin on a machine that is not otherwise loaded.
#
# If you hear crackling, raise min-quantum to 256. If the machine is very
# quiet, 64 works but leaves little room for a plugin that occasionally
# takes longer than usual.

context.properties = {
    default.clock.rate          = 48000
    # Rates the graph may switch to without a restart. The MK3 supports all
    # four, so a project at 44.1 or 96 kHz does not force a resample.
    default.clock.allowed-rates = [ 44100 48000 88200 96000 ]

    default.clock.quantum       = 128
    default.clock.min-quantum   = 64
    default.clock.max-quantum   = 1024
}
