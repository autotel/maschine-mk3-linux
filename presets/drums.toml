[preset]
name = "drums"
description = "General MIDI drum kit on the pads, transport on the buttons, knobs as a small mixer."

# DRUMS
#
# Pads follow the usual General MIDI drum numbering, laid out so the kick and
# snare sit under your left hand on the bottom row and the cymbals are up top.
# Aftertouch is off: most drum samplers ignore it and a resting hand should not
# be sending a stream of pressure.
#
# Only the transport and the pad-mode buttons send anything. Everything else is
# silent, so nothing unexpected reaches the host.

[general]
client_name = "Maschine MK3"
out_port = "Controller Out"
in_port = "Controller In"
realtime_priority = 80
lock_memory = true
gui_port = 0
gui_bind = "127.0.0.1"
connect_to = []

[display]
enabled = true
brightness = 80
contrast = 50
fps = 30
title = "DRUMS"

[leds]
enabled = true
button_idle = 10
button_active = 127
fps = 60

[pads]
channel = 10
# bottom row: kick, snare, closed hat, open hat
notes = [49, 55, 51, 57, 47, 48, 50, 52, 43, 45, 46, 53, 36, 38, 42, 44]
curve = "linear"
fixed_velocity = 100
velocity_max = 2000
aftertouch_max = 4095
aftertouch_curve = "soft"
threshold = 0
aftertouch = "off"
aftertouch_floor = 64
press_sends_note = false
idle_colour = 11
active_colour = 17
idle_level = 1

[knobs]
channel = 1
# volume, pan, send A, send B, then four spare
ccs = [7, 10, 91, 93, 12, 13, 14, 15]
mode = "accumulate"
relative_format = "twos"
high_resolution = false
pickup = "jump"
deadband = 2
travel = 1000
initial = 64

[encoder]
channel = 1
cc = 24
mode = "absolute"
relative_format = "twos"
step = 2
initial = 64

[touchstrip]
enabled = true
channel = 1
cc = 1
leds = true
led_reversed = false
led_value = 0x1f

[pedal]
enabled = true
channel = 1
ccs = [64, 67]
switch = true
switch_threshold = 2048

[buttons]

# --- Transport -------------------------------------------------
play                  = "cc 16 45"
stop                  = "cc 16 47"
rec                   = { send = "cc 16 46", mode = "toggle" }
restart               = "cc 16 41"
erase                 = "cc 16 42"
tap                   = "cc 16 43"
follow                = { send = "cc 16 44", mode = "toggle" }

# --- How the pads behave ---------------------------------------
note-repeat           = { send = "cc 16 20", mode = "toggle" }
pad-mode              = { send = "cc 16 24", mode = "toggle" }
keyboard              = { send = "cc 16 25", mode = "toggle" }
chords                = { send = "cc 16 26", mode = "toggle" }
step                  = { send = "cc 16 27", mode = "toggle" }
fixed-vel             = { send = "cc 16 28", mode = "toggle" }

# --- Group buttons pick a kit ----------------------------------
a                     = "cc 16 8"
b                     = "cc 16 9"
c                     = "cc 16 10"
d                     = "cc 16 11"
e                     = "cc 16 12"
f                     = "cc 16 13"
g                     = "cc 16 14"
h                     = "cc 16 15"
