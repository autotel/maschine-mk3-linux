[preset]
name = "one-channel"
description = "Everything on MIDI channel 1. Use this when a host only listens to one channel."

# ONE CHANNEL
#
# Pads, knobs, encoder, strip and every button all send on channel 1.
#
# Most presets spread controls across channels -- pads on 10, buttons on 16 --
# because that keeps them apart in a host that can filter. Some hosts cannot,
# or default a track's input to channel 1 only, and then the pads appear dead
# while the knobs work. This preset removes the question.
#
# CC numbers: knobs 16-23, encoder 24, strip 1, buttons 40 upwards by bit
# number. Nothing collides.

[general]
client_name = "Maschine MK3"
out_port = "Controller Out"
in_port = "Controller In"
realtime_priority = 80
lock_memory = true
gui_port = 0
gui_bind = "127.0.0.1"
auto_connect = true
connect_to = []

[display]
enabled = true
brightness = 80
contrast = 50
fps = 30
title = "ONE CHANNEL"

[leds]
enabled = true
button_idle = 10
button_active = 127
fps = 60

[pads]
channel = 1
notes = [48, 49, 50, 51, 44, 45, 46, 47, 40, 41, 42, 43, 36, 37, 38, 39]
curve = "linear"
fixed_velocity = 100
velocity_max = 2000
aftertouch_max = 4095
aftertouch_curve = "soft"
threshold = 0
aftertouch = "poly"
aftertouch_floor = 64
press_sends_note = false
idle_colour = 11
active_colour = 17
idle_level = 1

[knobs]
channel = 1
ccs = [16, 17, 18, 19, 20, 21, 22, 23]
mode = "accumulate"
relative_format = "twos"
high_resolution = false
pickup = "jump"
deadband = 2
travel = 1000
initial = 64

[encoder]
channel = 1
cc = 24
mode = "absolute"
relative_format = "twos"
step = 2
initial = 64

[touchstrip]
enabled = true
channel = 1
cc = 1
leds = true
led_reversed = false
led_value = 0x1f

[pedal]
enabled = false
channel = 1
ccs = [64, 67]
switch = true
switch_threshold = 2048

[buttons]
jogwheel-push         = "cc 1 40"
jogwheel-tilt-up      = "cc 1 42"
jogwheel-tilt-right   = "cc 1 43"
jogwheel-tilt-down    = "cc 1 44"
jogwheel-tilt-left    = "cc 1 45"
shift                 = "cc 1 46"
screen-8              = "cc 1 47"
a                     = "cc 1 48"
b                     = "cc 1 49"
c                     = "cc 1 50"
d                     = "cc 1 51"
e                     = "cc 1 52"
f                     = "cc 1 53"
g                     = "cc 1 54"
h                     = "cc 1 55"
notes                 = "cc 1 56"
volume                = "cc 1 57"
swing                 = "cc 1 58"
tempo                 = "cc 1 59"
note-repeat           = "cc 1 60"
lock                  = "cc 1 61"
pad-mode              = "cc 1 64"
keyboard              = "cc 1 65"
