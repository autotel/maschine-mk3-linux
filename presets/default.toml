[preset]
name = "default"
description = "Every control mapped: pads on channel 10, knobs on 1, buttons each on their own CC on channel 16."

# Maschine MK3 -- Linux userspace driver
#
# Everything here is live: save the file and the running driver picks it up.
# A file that fails to parse or validate is reported and ignored, so a typo
# never takes the controller down mid-session.
#
# Channels are 1-16 as written on a DAW's front panel.
# Run `mk3-learn buttons` to fill in the [button.*] section for your unit.

[general]
client_name = "Maschine MK3"
out_port = "Controller Out"
in_port = "Controller In"
# SCHED_FIFO priority for the input thread. 0 turns real-time scheduling off.
# Needs rtprio headroom -- on most distributions, membership of the `audio` group.
realtime_priority = 80
lock_memory = true
# Optional browser-based config page. Off by default -- `mk3-gui` is a native
# window that talks over a Unix socket and needs no port. Set a port here only
# to configure a machine you are logged into remotely.
gui_port = 0
gui_bind = "127.0.0.1"
# Sequencer destinations to subscribe our output to at startup, matched on a
# case-insensitive substring of "client:port". Some hosts list a MIDI input
# without ever connecting to it, which looks exactly like a driver that is not
# sending. Run `mk3d --list-ports` to see what is available.
#   connect_to = ["REAPER"]
connect_to = []

[display]
enabled = true
brightness = 80          # 0-100
contrast = 50            # 0-100
fps = 30                 # redraw ceiling
title = "MASCHINE MK3"

[leds]
enabled = true
button_idle = 10         # 0-127
button_active = 127
fps = 60

[pads]
channel = 10
# One note per pad, indexed by HID pad number.
#
# The device numbers pads in READING ORDER: HID pad 0 is the TOP-left pad, the
# one silkscreened 13. Confirmed on hardware. The default below is transposed
# so the bottom-left pad (silkscreen 1, HID 12) plays the lowest note, which is
# what drum mapping conventions expect.
#
#   HID  0  1  2  3   = top row,    silkscreen 13 14 15 16
#   HID  4  5  6  7   =             silkscreen  9 10 11 12
#   HID  8  9 10 11   =             silkscreen  5  6  7  8
#   HID 12 13 14 15   = bottom row, silkscreen  1  2  3  4
#
# For a plain ascending run in hardware order instead, use
# notes = [36, 37, 38, ... 51].
notes = [48, 49, 50, 51, 44, 45, 46, 47, 40, 41, 42, 43, 36, 37, 38, 39]
# linear | soft | hard | fixed
curve = "linear"
fixed_velocity = 100
# Raw hit value that maps to velocity 127.
#
# The pads report 12 bits but never use the range. Measured on a real MK3: a
# hard hit lands around 1950, ordinary playing sits between 200 and 1400. If
# you keep pinning at 127, raise this; if the pads feel weak, lower it.
velocity_max = 2000
# Raw pressure value that maps to aftertouch 127. Unlike strike velocity,
# pressure really does use the whole 12-bit range -- leaning hard on a pad
# reaches 4094.
aftertouch_max = 4095
# Shaping for pressure, separate from the strike curve above. Pressure is
# steeply non-linear: it loiters between 30 and 150 through most of the
# comfortable travel and only rockets to 4094 at the very end. "linear" would
# leave aftertouch near zero for almost the whole gesture, so "soft" is the
# default. linear | soft | hard
aftertouch_curve = "soft"
# Ignore hits below this raw 12-bit value (0-4095). Raise it if a hard hit on
# one pad makes a neighbour whisper.
threshold = 0
# off | poly | channel
aftertouch = "poly"
aftertouch_floor = 64
# Send a note when a finger rests on a pad without striking it.
press_sends_note = false
# Palette indices; see `mk3-learn palette` for the device's built-in ramp.
# Idle pad colour. This is what the pads glow when nothing is being played --
# set idle_level = 0 if you would rather they stayed dark.
idle_colour = 11         # blue
active_colour = 17       # white
idle_level = 1           # 0 off, 1 dim, 2 normal, 3 bright

[knobs]
channel = 1
ccs = [16, 17, 18, 19, 20, 21, 22, 23]
# accumulate | absolute | relative
#
# The eight knobs are ENDLESS encoders: they report a position that rolls over
# from 999 back to 0, so "absolute" makes them jump at the seam. "accumulate"
# integrates the movement here and clamps at the ends, which is what makes them
# behave like knobs with end stops -- turn up and you reach 127 and stay there.
mode = "accumulate"
# twos | bin-offset | sign-bit  (only used when mode = "relative")
relative_format = "twos"
# Send 14-bit values as cc and cc+32. Requires every cc below 32.
high_resolution = false
# jump | pickup
pickup = "jump"
# Ignore movements smaller than this many raw units (knobs read 0-999).
deadband = 2
# Raw units of travel spanning the full CC range, in accumulate mode. The knobs
# report 0..999 over one turn, so 1000 = one turn end to end. Halve it to make
# them twice as fast.
travel = 1000
# Where each knob sits at startup. An endless encoder has no position to read
# back, so it has to be assumed.
initial = 64

[encoder]
channel = 1
cc = 24
# The 4-D encoder is endless too, so it integrates and clamps the same way.
mode = "absolute"
relative_format = "twos"
# Detents per step. At 1 a full sweep takes 128 clicks; 2 halves that.
step = 2
initial = 64

[touchstrip]
enabled = true
channel = 1
cc = 1
# Light the strip's own LEDs to follow the finger.
leds = true
# Flip the meter if it fills from the wrong end on your unit.
led_reversed = false
# Raw LED byte for a lit segment. The strip does not decode colour the way the
# pads do -- the pads' green comes out violet here -- so this is a raw value,
# not a palette index. Anything from 1 to 127; try a few.
led_value = 0x1f

[pedal]
enabled = false
channel = 1
ccs = [64, 67]
switch = true
switch_threshold = 2048

# ---------------------------------------------------------------------------
# What each control sends
#
# Names come from the device profile -- the same names the panel uses. Where a
# control is wired (which bit, which LED) is not your business and is not here;
# it lives in devices/maschine-mk3.toml.
#
# Short form, when the defaults suit:
#
#     play = "cc 1 118"
#
# Long form, when they do not:
#
#     mute = { send = "cc 16 37", mode = "toggle", led = "midi" }
#
#   send   none | note CH N | cc CH N [VALUE] | pc CH N | start | stop | continue
#   mode   momentary (default) | toggle | trigger
#   led    follow (default, mirror the button) | midi (mirror the host)
#          | always | off
#
# Every button below sends its own CC on channel 16, numbered the same as its
# bit in the device's report. Nothing collides with the pads (channel 10) or
# the knobs (channel 1). Change any of it freely; delete a line to silence
# that control.
# ---------------------------------------------------------------------------

[buttons]

# --- Transport ---------------------------------------------------
restart               = "cc 16 41"
erase                 = "cc 16 42"
tap                   = "cc 16 43"
follow                = { send = "cc 16 44", mode = "toggle" }
play                  = "cc 16 45"
rec                   = { send = "cc 16 46", mode = "toggle" }
stop                  = "cc 16 47"

# --- Modifiers ---------------------------------------------------
# Shift is a modifier, so it is momentary whatever else you do.
shift                 = "cc 16 6"
lock                  = { send = "cc 16 21", mode = "toggle" }

# --- What the screens show ---------------------------------------
sampling              = { send = "cc 16 51", mode = "toggle" }
mixer                 = { send = "cc 16 52", mode = "toggle" }
plug-in               = { send = "cc 16 53", mode = "toggle" }
channel-midi          = { send = "cc 16 56", mode = "toggle" }
arranger              = { send = "cc 16 57", mode = "toggle" }
browser               = { send = "cc 16 58", mode = "toggle" }

# --- Navigation --------------------------------------------------
arrow-right           = "cc 16 50"
arrow-left            = "cc 16 59"

# --- File, settings and macros -----------------------------------
macro                 = "cc 16 48"
settings              = "cc 16 49"
file                  = "cc 16 60"
auto                  = { send = "cc 16 61", mode = "toggle" }

# --- The eight buttons above the displays ------------------------
screen-8              = "cc 16 7"
screen-1              = "cc 16 64"
screen-2              = "cc 16 65"
screen-3              = "cc 16 66"
screen-4              = "cc 16 67"
screen-5              = "cc 16 68"
screen-6              = "cc 16 69"
screen-7              = "cc 16 70"

# --- Group buttons A-H -------------------------------------------
a                     = "cc 16 8"
b                     = "cc 16 9"
c                     = "cc 16 10"
d                     = "cc 16 11"
e                     = "cc 16 12"
f                     = "cc 16 13"
g                     = "cc 16 14"
h                     = "cc 16 15"

# --- How the pads behave -----------------------------------------
note-repeat           = { send = "cc 16 20", mode = "toggle" }
pad-mode              = { send = "cc 16 24", mode = "toggle" }
keyboard              = { send = "cc 16 25", mode = "toggle" }
chords                = { send = "cc 16 26", mode = "toggle" }
step                  = { send = "cc 16 27", mode = "toggle" }
fixed-vel             = { send = "cc 16 28", mode = "toggle" }

# --- Which section the pads address ------------------------------
scene                 = { send = "cc 16 29", mode = "toggle" }
pattern               = { send = "cc 16 30", mode = "toggle" }
events                = { send = "cc 16 31", mode = "toggle" }
variation             = { send = "cc 16 33", mode = "toggle" }
duplicate             = { send = "cc 16 34", mode = "toggle" }
select                = { send = "cc 16 35", mode = "toggle" }
solo                  = { send = "cc 16 36", mode = "toggle" }
mute                  = { send = "cc 16 37", mode = "toggle" }

# --- Touch strip modes -------------------------------------------
notes                 = { send = "cc 16 16", mode = "toggle" }
pitch                 = { send = "cc 16 38", mode = "toggle" }
mod                   = { send = "cc 16 39", mode = "toggle" }
perform               = { send = "cc 16 40", mode = "toggle" }

# --- Level and timing --------------------------------------------
volume                = "cc 16 17"
swing                 = "cc 16 18"
tempo                 = "cc 16 19"

# --- The 4-D encoder ---------------------------------------------
jogwheel-push         = "cc 16 0"
jogwheel-tilt-up      = "cc 16 2"
jogwheel-tilt-right   = "cc 16 3"
jogwheel-tilt-down    = "cc 16 4"
jogwheel-tilt-left    = "cc 16 5"

# --- Touch sensors (no lights) -----------------------------------
# These are capacitive sensors, not buttons. Handy for gating a
# host's parameter takeover; bound to nothing by default.
jogwheel-touched      = "none"
knob-8-touch          = "none"
knob-7-touch          = "none"
knob-6-touch          = "none"
knob-5-touch          = "none"
knob-4-touch          = "none"
knob-3-touch          = "none"
knob-2-touch          = "none"
knob-1-touch          = "none"
