# Device profile: Native Instruments Maschine MK3
#
# This file describes the HARDWARE -- which bit in the HID report is which
# button, which LED slot lights it, where it sits on the panel. None of it is a
# preference; it is what the device is, and it was read off a real unit with
# `mk3-learn`.
#
# Your own settings live in config.toml, which refers to controls by the names
# below. Keeping the two apart means an update to this file cannot disturb your
# mapping, and that supporting another NI controller is a matter of writing a
# new profile rather than changing the driver.
#
# See docs/porting.md to write one for a different device.

[device]
name = "Maschine MK3"
vendor = 0x17cc
product = 0x1600

[report]
# HID input report carrying buttons, knobs, the encoder and the analog inputs.
controls = 0x01
# HID input report carrying pad events.
pads = 0x02
# HID output reports carrying LED state, as [report id, length in bytes].
# The driver addresses them as one flat array in this order.
led_banks = [[0x80, 62], [0x81, 41]]

[layout]
# Byte offsets inside the controls report, after the report id.
buttons_offset = 0
button_bits = 80
encoder_offset = 10
knobs_offset = 11
knobs = 8
# Knobs are endless encoders: this is the value they wrap at.
knob_max = 999
analog_offset = 27
analog_count = 7

pads = 16
# 12-bit pad readings.
pad_max = 4095

# Flat LED slot where each block begins.
pad_led_base = 87
strip_led_base = 62
strip_leds = 25
# Slot order runs the same way as the finger.
strip_led_reversed = false

# Which analog field the touch strip reports on, and its full-scale value.
# Field 0 is a free-running counter, not a control.
strip_analog = 1
strip_max = 1024
# First analog field belonging to the rear pedal jack.
pedal_analog_base = 4

# Panel geometry, in the arbitrary grid units the controls below use.
panel_width = 46.0
panel_height = 25.0



# ---------------------------------------------------------------------------
# Controls
#
# `bit` is the index in the controls report's button field. `led` is the flat
# LED slot; omitted where the control has no light. `led_colour` marks a slot
# that decodes its byte as (palette << 2) | level rather than as brightness.
# x/y/w/h place the control on the panel map in the configuration app.
# ---------------------------------------------------------------------------


