[package]
name = "maschine-mk3"
version = "0.1.0"
edition = "2021"
authors = ["joaquin"]
description = "Userspace driver turning the Native Instruments Maschine MK3 into a configurable MIDI controller on Linux"
license = "GPL-3.0-or-later"

[[bin]]
name = "mk3d"
path = "src/bin/mk3d.rs"

[[bin]]
name = "mk3-learn"
path = "src/bin/mk3_learn.rs"

[[bin]]
name = "mk3-gui"
path = "src/bin/mk3_gui.rs"
required-features = ["gui"]

[dependencies]
alsa = "0.9"
nusb = "0.1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"
libc = "0.2"
notify = { version = "6", default-features = false, features = ["macos_kqueue"] }
futures-lite = "2"
tiny_http = "0.12"
serde_json = "1"
eframe = { version = "0.27", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"], optional = true }
egui = { version = "0.27", optional = true }
toml_edit = "0.22"

[features]
default = ["gui"]
# The configuration window. Off by default on a headless build: the driver
# itself needs no windowing stack.
gui = ["dep:eframe", "dep:egui"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
